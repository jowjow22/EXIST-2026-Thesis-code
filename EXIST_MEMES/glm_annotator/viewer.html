<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memes extremos</title>
<style>
  :root {
    --bg: #fcfcfb; --panel: #ffffff; --ink: #0b0b0b; --muted: #52514e; --line: #e6e5e1;
    --yes: #c2410c; --yes-bg: #fdeee6; --no: #1d6fd1; --no-bg: #e8f1fc; --unk: #6b6a66; --unk-bg: #efeeea;
    --accent: #0b0b0b; --warn-bg: #fff6d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1c; --ink: #f2f1ed; --muted: #a3a29c; --line: #34332f;
      --yes: #f28b5b; --yes-bg: #3a2318; --no: #6aa8f0; --no-bg: #182a40; --unk: #a3a29c; --unk-bg: #2a2a28;
      --accent: #f2f1ed; --warn-bg: #3a3218;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .tabs button, .evalbtn, nav button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  .tabs button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  label.chk { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  .progress { margin-left: auto; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(320px, 1fr); gap: 20px; padding: 16px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .imgbox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; justify-content: center; }
  .imgbox img { max-width: 100%; max-height: 78vh; object-fit: contain; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .meta { color: var(--muted); }
  .meta b { color: var(--ink); }
  .text { white-space: pre-wrap; word-break: break-word; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border-radius: 6px; padding: 3px 8px; font-weight: 600; font-size: 13px; }
  .chip small { font-weight: 400; opacity: .8; }
  .YES { color: var(--yes); background: var(--yes-bg); }
  .NO { color: var(--no); background: var(--no-bg); }
  .unk { color: var(--unk); background: var(--unk-bg); }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  details { margin-top: 6px; }
  details summary { cursor: pointer; color: var(--muted); }
  details p { white-space: pre-wrap; margin: 4px 0 8px; font-size: 13px; }
  .flag { background: var(--warn-bg); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
  .evalrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .evalbtn.sel.YES { background: var(--yes); color: var(--panel); border-color: var(--yes); }
  .evalbtn.sel.NO { background: var(--no); color: var(--panel); border-color: var(--no); }
  .evalbtn.sel.AMB { background: var(--unk); color: var(--panel); border-color: var(--unk); }
  textarea { width: 100%; min-height: 56px; resize: vertical; }
  nav { display: flex; gap: 8px; align-items: center; }
  .hidden { filter: blur(8px); user-select: none; pointer-events: none; }
  .kbd { color: var(--muted); font-size: 12px; }
  .saved { color: var(--muted); font-size: 12px; min-height: 1em; }
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs"></div>
  <select id="lang"><option value="">en + es</option><option value="en">en</option><option value="es">es</option></select>
  <select id="filter">
    <option value="">todos</option>
    <option value="dis_off">GLM off discorda da maioria</option>
    <option value="dis_on">GLM on discorda da maioria</option>
    <option value="flip">off e on dão votos diferentes</option>
    <option value="todo">ainda não avaliados por mim</option>
  </select>
  <label class="chk"><input type="checkbox" id="blind"> modo cego (esconde humanos e GLM até eu avaliar)</label>
  <span class="progress" id="progress"></span>
</header>
<main id="main"><p>carregando…</p></main>

<script>
const GROUPS = { "1Y5N": "1 YES · 5 NO", "3Y3N": "3 YES · 3 NO", "5Y1N": "5 YES · 1 NO" };
const MAJ = { "1Y5N": "NO", "5Y1N": "YES", "3Y3N": null };   // maioria humana
const ARMS = [["think_off", "thinking off"], ["think_on", "thinking on"]];
let data = [], evals = {}, group = "1Y5N", pos = 0, list = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cls = l => (l === "YES" || l === "NO") ? l : "unk";
const vote = labs => { const y = labs.filter(l => l === "YES").length, n = labs.filter(l => l === "NO").length;
                       return y >= 2 ? "YES" : n >= 2 ? "NO" : "?"; };
const glmVote = (m, arm) => vote(m.glm[arm].map(x => x.label));

function rebuild(keepId) {
  const lang = $("lang").value, f = $("filter").value;
  list = data.filter(m => m.group === group && (!lang || m.lang === lang) && (
    !f || (f === "todo" && !evals[m.id]) || (f === "flip" && glmVote(m, "think_off") !== glmVote(m, "think_on")) ||
    ((f === "dis_off" || f === "dis_on") && MAJ[group] && glmVote(m, f === "dis_off" ? "think_off" : "think_on") !== MAJ[group])));
  const i = list.findIndex(m => m.id === keepId);
  pos = i >= 0 ? i : Math.min(pos, Math.max(list.length - 1, 0));
  $("tabs").innerHTML = Object.entries(GROUPS).map(([g, t]) => {
    const all = data.filter(m => m.group === g), done = all.filter(m => evals[m.id]).length;
    return `<button class="${g === group ? "on" : ""}" data-g="${g}">${t} <small>(${done}/${all.length})</small></button>`;
  }).join("");
  render();
}

function render() {
  const m = list[pos];
  const done = data.filter(x => evals[x.id]).length;
  $("progress").textContent = `${list.length ? pos + 1 : 0} / ${list.length} neste filtro · ${done} avaliados no total`;
  if (!m) { $("main").innerHTML = "<p>Nenhum meme neste filtro.</p>"; return; }
  const ev = evals[m.id] || {}, blind = $("blind").checked && !ev.label;
  const hidden = blind ? "hidden" : "";
  const nYes = m.humans.filter(h => h.label === "YES").length;
  const flags = ARMS.map(([a, n]) => MAJ[m.group] && glmVote(m, a) !== MAJ[m.group] ? `<span class="flag">${n}: discorda da maioria</span>` : "").join(" ");
  const glmRows = ARMS.map(([a, n]) => `<tr><th>${n}</th>${m.glm[a].map(x => `<td><span class="chip ${cls(x.label)}">${esc(x.label || "?")}</span></td>`).join("")}
      <td><span class="chip ${cls(glmVote(m, a))}">${glmVote(m, a)}</span></td></tr>`).join("");
  const reasons = m.glm.think_on.map((x, k) => x.reasoning ? `<details><summary>raciocínio P${k + 1} (${esc(x.label)})</summary><p>${esc(x.reasoning)}</p></details>` : "").join("");
  $("main").innerHTML = `
    <div class="imgbox"><img src="/img/${encodeURI(m.img)}" alt="meme ${esc(m.id)}"></div>
    <div class="side">
      <div class="card"><div class="meta"><b>${esc(m.id)}</b> · ${m.lang} · ${GROUPS[m.group]} ${flags ? "· " + flags : ""}</div></div>
      <div class="card"><h3>Texto do meme</h3><div class="text">${esc(m.text)}</div></div>
      <div class="card ${hidden}"><h3>Humanos (${nYes}/6 YES)</h3><div class="chips">
        ${m.humans.map(h => `<span class="chip ${cls(h.label)}">${h.label} <small>${h.gender} ${h.age}</small></span>`).join("")}</div></div>
      <div class="card ${hidden}"><h3>GLM-4.6V-Flash</h3>
        <table><tr><th></th><th>P1</th><th>P2</th><th>P3</th><th>voto</th></tr>${glmRows}</table>${reasons}</div>
      <div class="card"><h3>Minha avaliação</h3>
        <div class="evalrow">
          ${[["YES", "sexista (Y)"], ["NO", "não sexista (N)"], ["AMB", "ambíguo (A)"]].map(([v, t]) =>
            `<button class="evalbtn ${v} ${ev.label === v ? "sel" : ""}" data-v="${v}">${t}</button>`).join("")}
        </div>
        <textarea id="note" placeholder="nota (ex.: humor, crítica ao sexismo, depende de contexto…)">${esc(ev.note || "")}</textarea>
        <div class="saved" id="saved"></div>
      </div>
      <nav><button id="prev">← anterior</button><button id="next">próximo →</button>
        <span class="kbd">teclas: ← → navegar · Y / N / A avaliar (fora da nota)</span></nav>
    </div>`;
}

async function save(id, label, note) {
  const e = { id, label, note, ts: new Date().toISOString() };
  const r = await fetch("/eval", { method: "POST", body: JSON.stringify(e) });
  if (!r.ok) { $("saved").textContent = "erro ao gravar: avaliação NÃO salva"; return false; }
  if (label == null && !note) delete evals[id]; else evals[id] = e;
  return true;
}

async function evaluate(v) {
  const m = list[pos]; if (!m) return;
  const label = (evals[m.id] || {}).label === v ? null : v;   // clicar de novo desmarca
  if (!await save(m.id, label, $("note").value)) return;
  if ($("filter").value === "todo") rebuild();                 // o avaliado sai da lista; pos já aponta o próximo
  else { rebuild(m.id); if (label) go(1); }                    // avança para o próximo
  $("saved").textContent = `gravado: ${m.id} → ${label ?? "desmarcado"}`;
}
const go = d => { pos = Math.max(0, Math.min(list.length - 1, pos + d)); render(); };

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.g) { group = t.dataset.g; pos = 0; rebuild(); }
  else if (t.dataset.v) evaluate(t.dataset.v);
  else if (t.id === "prev") go(-1);
  else if (t.id === "next") go(1);
});
document.addEventListener("change", e => {
  if (e.target.id === "note") {                                  // grava a nota sem redesenhar a tela
    const m = list[pos];
    save(m.id, (evals[m.id] || {}).label ?? null, e.target.value).then(ok => ok && ($("saved").textContent = "nota gravada"));
  }
  else if (["lang", "filter"].includes(e.target.id)) { pos = 0; rebuild(); }
  else if (e.target.id === "blind") render();
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if ({ y: 1, n: 1, a: 1 }[e.key.toLowerCase()]) evaluate({ y: "YES", n: "NO", a: "AMB" }[e.key.toLowerCase()]);
});

Promise.all([fetch("/data").then(r => r.json()), fetch("/evals").then(r => r.json())])
  .then(([d, ev]) => { data = d; evals = ev; rebuild(); });
</script>
</body>
</html>
